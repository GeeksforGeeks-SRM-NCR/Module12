[package]
name = "rural-dtn-module"
version = "0.1.0"
edition = "2021"
authors = ["GFG Barnacle Team"]
description = "Delay-Tolerant Networking (DTN) module for rural region connectivity - store-and-forward messaging for intermittent networks"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.2", features = ["js"] }
uuid = { version = "1.0", features = ["v4", "wasm-bindgen"] }
js-sys = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = ["console", "Window", "Document", "Element", "HtmlElement"]

[profile.release]
opt-level = "z"
lto = true
